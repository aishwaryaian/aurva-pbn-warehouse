name: Warehouse checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: |
          python -m py_compile app.py test_app.py
          node --check static/app.js
      - name: Run warehouse database and packing tests
        run: python test_app.py
